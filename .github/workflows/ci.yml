name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grafo
          POSTGRES_PASSWORD: grafo
          POSTGRES_DB: grafo_tareas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://grafo:grafo@localhost:5432/grafo_tareas_test?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # la versión sale de packageManager en package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint:ci
      - run: pnpm build
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm test:e2e
      # El contrato versionado no puede quedar atrás del código: la PWA y la VR generan sus hooks de acá.
      - run: pnpm openapi:export && git diff --exit-code openapi.json
      # La API no conoce ninguna herramienta (concepto § Prueba de que sigue agnóstico).
      - run: '! grep -rnE "sag\.laboratorio|Laboratorio/|dev\.azure|6VhFQg6v45qcJHPc|todoist" src'

  # FASE 27: con los tests en verde, el push a main queda en producción. Corre en el runner del Mac Mini el
  # deploy/desplegar-aqui.sh publicado del orquestador (el mismo que usa bin/desplegar a mano). Despliega todo junto e
  # idempotente: lo que no cambió no se reconstruye. El candado del script evita dos composes a la vez entre repos.
  deploy:
    name: Desplegar en el Mac Mini
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mac-mini, grafo]
    # Un deploy colgado (2026-11-14: 35 min en `load metadata`) no retiene el runner las 6 h por defecto.
    timeout-minutes: 45
    steps:
      - name: deploy/desplegar-aqui.sh de origin/main del orquestador
        run: |
          # Sin pipefail, si `git show` falla `bash -s` lee un script vacío y el paso sale en verde sin desplegar.
          set -o pipefail
          git -C "$HOME/apps/grafo-tareas" fetch -q origin main
          git -C "$HOME/apps/grafo-tareas" show origin/main:deploy/desplegar-aqui.sh \
            | GRAFO_REPO=grafo-tareas.api GRAFO_SHA="$GITHUB_SHA" bash -s
