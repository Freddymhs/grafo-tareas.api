services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://grafo:grafo@postgres:5432/grafo_tareas?schema=public
      - CORS_ORIGINS=http://localhost:3001
      - PINO_LOG_LEVEL=info
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=100
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: pnpm dev

  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: grafo
      POSTGRES_PASSWORD: grafo
      POSTGRES_DB: grafo_tareas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grafo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
